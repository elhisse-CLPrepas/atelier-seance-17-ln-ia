name: Publier l'atelier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer la version enregistrée
        uses: actions/checkout@v6
      - name: Vérifier la présence du site construit
        run: test -s dist/index.html && test -d dist/supports && test -d dist/dossier-challenge
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Préparer le site et ses supports
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
